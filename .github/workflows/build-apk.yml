name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk EduNexus.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EduNexus-apk
          path: EduNexus.apk

      # Publishes the APK as a GitHub Release so it can be downloaded
      # straight onto a phone from the repo's Releases page.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: EduNexus build ${{ github.run_number }}
          body: |
            Demo build from ${{ github.sha }}.
            Install: download EduNexus.apk on your Android phone, allow "Install unknown apps" for your browser, open the file.
            Sign in with any role → Get OTP → 1234.
          files: EduNexus.apk
          make_latest: true
